name: Tests on PR to Development

on:
  pull_request:
    branches: [development]

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_e2e_tests: ${{ steps.changed.outputs.has_e2e_tests }}
      e2e_files: ${{ steps.changed.outputs.e2e_files }}
      has_api_tests: ${{ steps.changed.outputs.has_api_tests }}
      api_files: ${{ steps.changed.outputs.api_files }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed test files
        id: changed
        run: |
          BASE="origin/${{ github.base_ref }}"
          E2E=$(git diff --name-only ${BASE}...HEAD -- 'web/src/tests/e2e/**')
          API=$(git diff --name-only ${BASE}...HEAD -- 'api/src/tests/**')

          E2E_FILES=$(echo "$E2E" | sed 's|^web/||' | tr '\n' ' ' | xargs)
          API_FILES=$(echo "$API" | sed 's|^api/||' | tr '\n' ' ' | xargs)

          echo "e2e_files=$E2E_FILES" >> $GITHUB_OUTPUT
          echo "api_files=$API_FILES" >> $GITHUB_OUTPUT
          echo "has_e2e_tests=$([ -n "$E2E_FILES" ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has_api_tests=$([ -n "$API_FILES" ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

  test-api:
    needs: detect
    if: needs.detect.outputs.has_api_tests == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: "pnpm"
          cache-dependency-path: api/pnpm-lock.yaml

      - name: Install API dependencies
        working-directory: api
        run: pnpm install

      # Port 5483 (not 5432): the app reads DATABASE_URL from Infisical (env "dev"),
      # which points to localhost:5483, so the CI database must listen there too.
      # With 5432, every API test file failed with ECONNREFUSED 127.0.0.1:5483.
      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name mintly-pg \
            -p 5483:5432 \
            -e POSTGRES_USER=mintly \
            -e POSTGRES_PASSWORD=mintly \
            -e POSTGRES_DB=mintly \
            bitnami/postgresql:latest

      - name: Wait for PostgreSQL
        run: until docker exec mintly-pg pg_isready -U mintly; do sleep 1; done

      # Retry: this step failed intermittently on CI (silently, with only
      # ELIFECYCLE in the log) and the cause is not known. Migrations are
      # idempotent, so retrying is safe.
      - name: Run migrations
        working-directory: api
        run: |
          for attempt in 1 2 3 4 5; do
            if pnpm db:migrate; then
              exit 0
            fi
            echo "Migration attempt $attempt/5 failed"
            sleep 3
          done
          echo "Migrations failed after 5 attempts"
          exit 1
        env:
          DATABASE_URL: postgresql://mintly:mintly@localhost:5483/mintly

      # Surface the real cause when anything above fails.
      - name: Postgres container logs (on failure)
        if: failure()
        run: docker logs mintly-pg

      - name: Run API tests
        working-directory: api
        run: pnpm test ${{ needs.detect.outputs.api_files }}
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_ENVIRONMENT: "dev"

  test-e2e:
    needs: [detect, test-api]
    if: |
      always() &&
      needs.detect.outputs.has_e2e_tests == 'true' &&
      (needs.test-api.result == 'success' || needs.test-api.result == 'skipped')
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: "pnpm"
          cache-dependency-path: |
            web/pnpm-lock.yaml
            api/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install

      # Migrations and the seed run through `dotenv-cli` (an api devDependency).
      # Without this install, `dotenv` resolves to the Ruby gem preinstalled on
      # ubuntu runners and fails with "invalid option: -e".
      - name: Install API dependencies
        working-directory: api
        run: pnpm install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        working-directory: web
        run: pnpm exec playwright install --with-deps

      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name mintly-pg \
            -p 5483:5432 \
            -e POSTGRES_USER=mintly \
            -e POSTGRES_PASSWORD=mintly \
            -e POSTGRES_DB=mintly \
            bitnami/postgresql:latest

      - name: Build API image
        run: docker build -t mintly-api ./api

      - name: Wait for PostgreSQL
        run: until docker exec mintly-pg pg_isready -U mintly; do sleep 1; done

      # Retry: this step failed intermittently on CI (silently, with only
      # ELIFECYCLE in the log) and the cause is not known. Migrations are
      # idempotent, so retrying is safe.
      - name: Run migrations
        working-directory: api
        run: |
          for attempt in 1 2 3 4 5; do
            if pnpm db:migrate; then
              exit 0
            fi
            echo "Migration attempt $attempt/5 failed"
            sleep 3
          done
          echo "Migrations failed after 5 attempts"
          exit 1
        env:
          DATABASE_URL: postgresql://mintly:mintly@localhost:5483/mintly

      # Surface the real cause when anything above fails.
      - name: Postgres container logs (on failure)
        if: failure()
        run: docker logs mintly-pg

      - name: Seed E2E test user
        working-directory: api
        run: pnpm db:seed
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_ENVIRONMENT: "dev"

      - name: Start API
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        run: |
          docker run -d \
            --name mintly-api \
            --network host \
            -e "BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET" \
            -e NODE_ENV=production \
            -e OTEL_SERVICE_NAME=mintly-api-e2e \
            -e OTEL_TRACES_EXPORTER=none \
            -e "INFISICAL_CLIENT_ID=$INFISICAL_CLIENT_ID" \
            -e "INFISICAL_CLIENT_SECRET=$INFISICAL_CLIENT_SECRET" \
            -e "INFISICAL_PROJECT_ID=$INFISICAL_PROJECT_ID" \
            -e INFISICAL_ENVIRONMENT=dev \
            mintly-api

      - name: Wait for API
        run: until curl -sf http://localhost:3000/api/health; do sleep 1; done

      - name: Show API logs
        run: docker logs mintly-api

      - name: Build frontend
        working-directory: web
        run: pnpm build
        env:
          VITE_API_BASE_URL: http://localhost:3000
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_NODE_ENV: production

      - name: Run E2E tests
        working-directory: web
        run: pnpm test ${{ needs.detect.outputs.e2e_files }}
        env:
          VITE_API_BASE_URL: http://localhost:3000
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_NODE_ENV: production

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 30
