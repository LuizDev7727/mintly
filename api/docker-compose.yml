services:
  mintly-pg:
    image: bitnami/postgresql:latest
    ports:
      - "5483:5432"
    environment:
      - POSTGRES_USER=mintly
      - POSTGRES_PASSWORD=mintly
      - POSTGRES_DB=mintly

  mintly-redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-ui:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540" # UI
    depends_on:
      - mintly-redis

  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686" # UI
      - "6831:6831/udp" # Traces UDP
      - "14268:14268" # Traces HTTP
      - "4317:4317" # OTLP/gRPC
      - "4318:4318" # OTLP/HTTP
